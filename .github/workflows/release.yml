# Builds the Windows executable and publishes it as a GitHub Release whenever
# a version tag (v*) is pushed, e.g. `git tag v0.0.13 && git push origin v0.0.13`.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            target/release/test-your-might.exe \
            --title "${{ github.ref_name }}" \
            --generate-notes
