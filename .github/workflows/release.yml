# Builds and tests the Windows and macOS apps and the web version on every
# push to main (and on pull requests), including an end-to-end test of
# self-updating on both desktops.
# Pushing a version tag (v*) additionally signs the desktop builds and
# publishes them as a GitHub Release, e.g. `git tag v1.2.3 && git push origin
# v1.2.3` for Cargo.toml version 1.2.3 (the publish job checks they match),
# and deploys the web version to production on Vercel. Pull requests get a
# Vercel preview deployment.
#
# Publishing needs the repository secret MINISIGN_SECRET_KEY: the contents of
# the minisign secret key whose public half is keys/release-signing.pub (see
# docs/releasing.md). The game refuses updates not signed with it.
# Deploying the web version needs VERCEL_TOKEN, VERCEL_ORG_ID and
# VERCEL_PROJECT_ID (see docs/web.md); without them it's skipped.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/release/test-your-might.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Test
        run: cargo test --release

      # One universal binary, so the same download runs on Apple Silicon and
      # Intel Macs.
      - name: Build
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output test-your-might \
            target/aarch64-apple-darwin/release/test-your-might \
            target/x86_64-apple-darwin/release/test-your-might
          lipo -info test-your-might

      - name: Bundle
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tools/macos/bundle.sh test-your-might "$version" .
          ditto -c -k --keepParent "Test Your Might.app" test-your-might-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: test-your-might-macos.zip
          if-no-files-found: error

  # The web version (docs/web.md): lint and build it for wasm32, packaged for
  # Vercel.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      # The desktop jobs' tests don't compile the web-only code.
      - name: Lint
        run: cargo clippy --release --target wasm32-unknown-unknown -- -D warnings

      - name: Build
        run: |
          trunk build --release
          tools/web/vercel-output.sh dist
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: .vercel/output
          include-hidden-files: true
          if-no-files-found: error

  # Installs a signed "newer" build over this one with the real --update code
  # path, and checks bad releases are refused (tools/update-e2e.sh).
  update-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Self-update end-to-end test
        shell: bash
        run: tools/update-e2e.sh

  publish:
    needs: [windows, macos, update-e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A tag that doesn't match the built version would make every copy of
      # the game offer this "update" forever.
      - name: Check tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi

      - uses: actions/download-artifact@v4

      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::the MINISIGN_SECRET_KEY secret isn't set (see docs/releasing.md)"
            exit 1
          fi
          sudo apt-get install -y minisign
          key="$RUNNER_TEMP/release-signing.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          tools/sign-release.sh "$key" "${GITHUB_REF_NAME#v}" \
            windows/test-your-might.exe macos/test-your-might-macos.zip
          rm "$key"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            windows/test-your-might.exe windows/test-your-might.exe.minisig \
            macos/test-your-might-macos.zip macos/test-your-might-macos.zip.minisig \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  # Deploys the web version once everything has passed: a preview for pull
  # requests, production for version tags.
  deploy-web:
    needs: [web, windows, macos, update-e2e]
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: .vercel/output

      - name: Deploy
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Vercel secrets aren't set (see docs/web.md); not deploying the web version"
            exit 0
          fi
          prod=
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then prod=--prod; fi
          url=$(npx --yes vercel@latest deploy --prebuilt $prod --token "$VERCEL_TOKEN")
          echo "Deployed the web version: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "$url"
