[package]
name = "test-your-might"
version = "0.0.26"
edition = "2021"

# The game builds for the desktop (Windows, macOS, and Linux for development)
# and for the web (wasm32, see index.html and docs/web.md). Dependencies only
# one of them needs are in the target sections below; Cargo's feature
# resolver keeps each side's features out of the other's build.
[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# std::time on the desktop; the browser's clock on the web, where
# std::time::Instant panics.
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories = "5"
minisign-verify = "0.2.5"
self-replace = "1.5.0"
# Sound effects (src/audio.rs): playback only, MP3 only.
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# rodio only decodes the MP3s here; the browser's Web Audio plays them.
rodio = { version = "0.22.2", default-features = false, features = ["mp3"] }
# Browser randomness and time zone for rand and chrono.
getrandom = { version = "0.2", features = ["js"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "wasmbind"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "Document",
    "Element",
    "EventTarget",
    "GainNode",
    "HtmlCanvasElement",
    "Location",
    "Storage",
    "UrlSearchParams",
    "Window",
    "console",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

# Self-update HTTPS (src/update.rs). Windows and macOS use the OS's own TLS
# (SChannel / Security.framework), so certificates the OS trusts - e.g. a
# company proxy's - work. Linux, only used for development, uses rustls.
# The web build has no self-update.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls"] }

[target.'cfg(not(any(windows, target_os = "macos", target_arch = "wasm32")))'.dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"

[[bin]]
name = "test-your-might"
path = "src/main.rs"

[dev-dependencies]
minisign = "0.9.1"
resvg = "0.48.1"
