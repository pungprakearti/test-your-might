[package]
name = "test-your-might"
version = "0.0.12"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"

[[bin]]
name = "test-your-might"
path = "src/main.rs"
